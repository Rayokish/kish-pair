<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KISH-MD Fork Verification</title>
  <style>
    :root {
      --background: #0d1117;
      --text: #c9d1d9;
      --primary: #58a6ff;
      --success: #3fb950;
      --error: #f85149;
      --warning: #d29922;
      --border: #30363d;
      --prefix: #7ee787;
      --cursor: #f0f6fc;
      --input-bg: #161b22;
      --selection: rgba(56, 139, 253, 0.3);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background: var(--background);
      color: var(--text);
      font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      line-height: 1.5;
    }
    
    .terminal {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 100%;
      max-width: 700px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      color: var(--primary);
    }
    
    .logo {
      font-size: 24px;
      margin-right: 10px;
    }
    
    .title {
      font-weight: bold;
    }
    
    .prompt {
      color: var(--prefix);
      margin-bottom: 5px;
      white-space: pre-wrap;
    }
    
    .command-line {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    
    .prefix {
      color: var(--prefix);
      margin-right: 8px;
      user-select: none;
    }
    
    input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: inherit;
      padding: 5px 0;
      caret-color: var(--cursor);
    }
    
    input::selection {
      background: var(--selection);
    }
    
    input:focus {
      outline: none;
    }
    
    .btn {
      background: var(--primary);
      color: var(--background);
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
      position: relative;
      overflow: hidden;
    }
    
    .btn:hover {
      background: #388bfd;
    }
    
    .btn:active {
      transform: translateY(1px);
    }
    
    .btn-loading::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      animation: loading 1.5s infinite;
    }
    
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    
    .output {
      margin-top: 20px;
      min-height: 24px;
      white-space: pre-wrap;
    }
    
    .success {
      color: var(--success);
    }
    
    .error {
      color: var(--error);
    }
    
    .warning {
      color: var(--warning);
    }
    
    .typing {
      border-right: 2px solid var(--text);
      animation: blink 1s step-end infinite;
    }
    
    @keyframes blink {
      from, to { border-color: transparent; }
      50% { border-color: var(--text); }
    }
    
    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 25px;
      font-size: 13px;
    }
    
    .feature {
      background: rgba(56, 139, 253, 0.15);
      color: var(--primary);
      padding: 4px 8px;
      border-radius: 20px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 0.3s forwards;
    }
    
    .feature:nth-child(1) { animation-delay: 0.1s; }
    .feature:nth-child(2) { animation-delay: 0.2s; }
    .feature:nth-child(3) { animation-delay: 0.3s; }
    .feature:nth-child(4) { animation-delay: 0.4s; }
    
    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    footer {
      margin-top: 30px;
      color: #6e7681;
      font-size: 12px;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.5s 0.5s forwards;
    }
    
    .progress-bar {
      height: 2px;
      background: var(--primary);
      width: 0;
      margin-top: 10px;
      transition: width 0.3s;
    }
    
    /* Terminal output animations */
    .terminal-output {
      animation: fadeInUp 0.3s;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Responsive adjustments */
    @media (max-width: 600px) {
      .terminal {
        padding: 16px;
      }
      .header {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="terminal">
    <div class="header">
      <div class="logo">❯</div>
      <div class="title">KISH-MD Fork Verification</div>
    </div>
    
    <div id="welcome-prompt" class="prompt"></div>
    
    <div class="command-line">
      <span class="prefix">$</span>
      <input type="text" id="githubUsername" placeholder="" 
             onkeypress="if(event.key === 'Enter') isForked()">
    </div>
    
    <button id="verify-btn" class="btn" onclick="isForked()">Run Verification</button>
    <div class="progress-bar" id="progress-bar"></div>
    
    <div id="message" class="output"></div>
    
    <div class="features">
      <div class="feature">Multi-Device</div>
      <div class="feature">AI Powered</div>
      <div class="feature">200+ Commands</div>
      <div class="feature">Secure</div>
    </div>
    
    <footer>
      KISH-MD &copy; <span id="currentYear"></span> | Powered by BrashoKish
    </footer>
  </div>

  <script>
    // Set current year
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    // Animated welcome message
    const welcomeMessages = [
      "Welcome to KISH-MD Fork Verification",
      "Please verify your GitHub fork to proceed with pairing",
      "Enter your GitHub username below ↓"
    ];
    
    const welcomePrompt = document.getElementById('welcome-prompt');
    const input = document.getElementById('githubUsername');
    const verifyBtn = document.getElementById('verify-btn');
    const progressBar = document.getElementById('progress-bar');
    
    // Type welcome messages one by one
    async function typeWelcomeMessages() {
      for (const message of welcomeMessages) {
        await typeText(welcomePrompt, message);
        await delay(500);
        welcomePrompt.innerHTML += '<br><br>';
      }
      // Start input placeholder animation after welcome messages
      typeInputPlaceholder();
    }
    
    // Type text with cursor animation
    async function typeText(element, text) {
      element.innerHTML = '';
      const cursor = document.createElement('span');
      cursor.className = 'typing';
      element.appendChild(cursor);
      
      for (let i = 0; i < text.length; i++) {
        cursor.remove();
        element.innerHTML += text[i];
        element.appendChild(cursor);
        await delay(Math.random() * 50 + 30);
      }
      
      cursor.remove();
    }
    
    // Type input placeholder
    async function typeInputPlaceholder() {
      const placeholderText = "Enter GitHub username and press Enter";
      input.placeholder = '';
      
      for (let i = 0; i < placeholderText.length; i++) {
        input.placeholder = placeholderText.substring(0, i + 1);
        await delay(Math.random() * 50 + 30);
      }
      
      // Add blinking cursor effect
      input.focus();
    }
    
    // Helper function for delays
    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
    
    // Initialize animations
    setTimeout(typeWelcomeMessages, 500);
    
    // Reset placeholder animation when input is focused/blurred
    input.addEventListener('focus', () => {
      input.placeholder = "Enter GitHub username and press Verification";
    });
    
    input.addEventListener('blur', () => {
      if (input.value === '') {
        typeInputPlaceholder();
      }
    });
    
    // Show loading state during verification
    async function showLoading() {
      verifyBtn.classList.add('btn-loading');
      verifyBtn.disabled = true;
      
      // Animate progress bar
      progressBar.style.width = '100%';
      progressBar.style.transition = 'width 1.5s linear';
      
      await delay(1500);
    }
    
    // Hide loading state
    function hideLoading() {
      verifyBtn.classList.remove('btn-loading');
      verifyBtn.disabled = false;
      progressBar.style.width = '0';
    }
    
    // GitHub API check
    async function chkfork(username, repon) {
      const url = `https://api.github.com/repos/${username}/${repon}`;
      const message = document.getElementById('message');

      try {
        const response = await fetch(url);
        if (response.ok) {
          const data = await response.json();
          return data.fork;
        } else {
          showMessage('error', `❌ Error: GitHub username not found or rate limit exceeded`);
          return false;
        }
      } catch (error) {
        console.error('Error:', error);
        showMessage('error', '❌ Network error occurred. Please try again.');
        return false;
      }
    }
    
    // Show animated message
    function showMessage(type, text) {
      const message = document.getElementById('message');
      message.className = 'output terminal-output';
      message.innerHTML = `<span class="${type}">${text}</span>`;
    }
    
    // Main verification function
    async function isForked() {
      const username = document.getElementById('githubUsername').value.trim();
      const message = document.getElementById('message');

      if (!username) {
        showMessage('error', '❌ Please enter your GitHub username');
        return;
      }

      showMessage('warning', `Verifying fork for ${username}...`);
      await showLoading();
      
      const isForked = await chkfork(username, 'Kish-MD');
      hideLoading();

      if (isForked) {
        showMessage('success', '✅ Repository verified! Redirecting to pairing interface...');
        setTimeout(() => {
          window.location.href = 'pair.kishtechsite.online/';
        }, 1500);
      } else {
        showMessage('error', `❌ Fork not found for ${username}`);
        if (confirm("❌ You haven't forked Kish-MD repository. Press OK to fork it now (don't modify the fork name).")) {
          window.open('https://github.com/Brashokish/Kish-MD/fork', '_blank');
        }
      }
    }
    
    // Allow clicking anywhere in terminal to focus input
    document.querySelector('.terminal').addEventListener('click', () => {
      input.focus();
    });
  </script>
</body>
</html>
