<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KISH-MD QR CODE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');

    body {
      margin: 0;
      height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    h1 {
      font-size: 3rem;
      background: linear-gradient(270deg, #00ffff, #ff00ff, #00ff00, #ff0000, #ffff00, #00ffff);
      background-size: 1200% 1200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glowGradient 8s ease infinite;
      text-align: center;
      margin-bottom: 40px;
      text-shadow:
        0 0 5px #0ff,
        0 0 10px #f0f,
        0 0 20px #0ff,
        0 0 40px #f0f,
        0 0 80px #0ff;
    }

    @keyframes glowGradient {
      0% {
        background-position: 0% 50%;
        text-shadow:
          0 0 5px #00ffff,
          0 0 10px #ff00ff,
          0 0 20px #00ff00,
          0 0 40px #ff0000,
          0 0 80px #ffff00;
      }
      50% {
        background-position: 100% 50%;
        text-shadow:
          0 0 10px #ff00ff,
          0 0 20px #00ff00,
          0 0 40px #ff0000,
          0 0 80px #ffff00,
          0 0 160px #00ffff;
      }
      100% {
        background-position: 0% 50%;
        text-shadow:
          0 0 5px #00ffff,
          0 0 10px #ff00ff,
          0 0 20px #00ff00,
          0 0 40px #ff0000,
          0 0 80px #ffff00;
      }
    }

    .qr-container {
      background: #111;
      padding: 25px;
      border-radius: 20px;
      box-shadow:
        0 0 20px #0ff,
        0 0 40px #f0f inset,
        0 0 60px #0ff inset;
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 280px;
    }

    /* Example QR placeholder */
    .qr-code {
      width: 240px;
      height: 240px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 15px #0ff, 0 0 30px #f0f;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: #222;
      font-size: 1.2rem;
      user-select: none;
    }
  </style>
</head>
<body>

  <h1>KISH-MD QR CODE</h1>

  <div class="qr-container">
    <div class="qr-code">
      QR CODE HERE
    </div>
  </div>

</body>
</html>
