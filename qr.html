<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KISH-MD QR Authentication</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --secondary: #10b981;
      --background: #0f172a;
      --surface: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
      --border: #334155;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--background);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }
    
    .header {
      margin-bottom: 25px;
    }
    
    .logo {
      font-size: 2.5rem;
      color: var(--primary);
      margin-bottom: 10px;
    }
    
    .title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }
    
    .qr-container {
      position: relative;
      margin: 20px auto;
      width: 250px;
      height: 250px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #qr-image {
      max-width: 100%;
      max-height: 100%;
      transition: opacity 0.3s ease;
    }
    
    .qr-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    
    .qr-container.loading .qr-overlay {
      opacity: 1;
      pointer-events: auto;
    }
    
    .progress-container {
      width: 80%;
      height: 6px;
      background-color: var(--border);
      border-radius: 3px;
      margin: 15px 0;
      overflow: hidden;
    }
    
    .progress-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      animation: progressAnimation 40s linear infinite;
      transform-origin: left;
    }
    
    @keyframes progressAnimation {
      0% {
        transform: scaleX(1);
      }
      100% {
        transform: scaleX(0);
      }
    }
    
    .time-remaining {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 10px;
    }
    
    .status {
      margin: 20px 0;
      padding: 12px;
      border-radius: 8px;
      font-weight: 500;
    }
    
    .status-loading {
      background: rgba(59, 130, 246, 0.1);
      color: var(--primary);
    }
    
    .status-success {
      background: rgba(34, 197, 94, 0.1);
      color: var(--success);
    }
    
    .status-error {
      background: rgba(239, 68, 68, 0.1);
      color: var(--error);
    }
    
    .btn {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    
    /* Animation for QR code refresh */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }
    
    /* Responsive adjustments */
    @media (max-width: 480px) {
      .card {
        padding: 20px;
      }
      
      .qr-container {
        width: 200px;
        height: 200px;
      }
      
      .title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="logo">
          <i class="fas fa-qrcode"></i>
        </div>
        <h1 class="title">KISH-MD Authentication</h1>
        <p class="subtitle">Scan QR code with your WhatsApp</p>
      </div>
      
      <div class="qr-container" id="qr-container">
        <img id="qr-image" src="" alt="QR Code" class="fade-in">
        <div class="qr-overlay">
          <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary);"></i>
          <p style="margin-top: 15px; color: var(--text);">Generating QR code...</p>
        </div>
      </div>
      
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="time-remaining" id="time-remaining">Refreshing in 40 seconds</div>
      
      <div id="status" class="status status-loading">Loading QR code...</div>
      
      <button id="refresh-btn" class="btn">
        <i class="fas fa-sync-alt"></i> Refresh QR Code
      </button>
    </div>
    
    <footer>
      KISH-MD &copy; <span id="currentYear"></span> | Secure Authentication
    </footer>
  </div>

  <script>
    // Set current year
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    // DOM elements
    const qrImage = document.getElementById('qr-image');
    const qrContainer = document.getElementById('qr-container');
    const statusDiv = document.getElementById('status');
    const refreshBtn = document.getElementById('refresh-btn');
    const progressBar = document.getElementById('progress-bar');
    const timeRemaining = document.getElementById('time-remaining');
    
    const refreshInterval = 40000; // 40 seconds
    let countdown;
    let refreshTimer;

    function updateTimeRemaining(seconds) {
      timeRemaining.textContent = `Refreshing in ${seconds} seconds`;
    }

    function startCountdown() {
      let seconds = refreshInterval / 1000;
      updateTimeRemaining(seconds);

      countdown = setInterval(() => {
        seconds--;
        updateTimeRemaining(seconds);

        if (seconds <= 0) {
          clearInterval(countdown);
        }
      }, 1000);
    }

    async function fetchQR() {
      try {
        // Show loading state
        qrContainer.classList.add('loading');
        statusDiv.className = 'status status-loading';
        statusDiv.textContent = 'Generating QR code...';
        
        clearInterval(countdown);
        clearTimeout(refreshTimer);

        const timestamp = new Date().getTime();
        const response = await fetch(`/qr-api?t=${timestamp}`);

        if (!response.ok) throw new Error('Failed to load QR code');

        const blob = await response.blob();
        const objectUrl = URL.createObjectURL(blob);

        // Update QR code image
        qrImage.src = objectUrl;
        qrImage.classList.add('fade-in');
        
        // Remove loading state
        setTimeout(() => {
          qrContainer.classList.remove('loading');
          statusDiv.className = 'status status-success';
          statusDiv.textContent = 'Scan this QR code with WhatsApp';
          statusDiv.innerHTML = '<i class="fas fa-check-circle"></i> QR code ready - Scan with WhatsApp';
        }, 500);

        // Clean up previous object URL if exists
        if (qrImage._lastObjectUrl) {
          URL.revokeObjectURL(qrImage._lastObjectUrl);
        }
        qrImage._lastObjectUrl = objectUrl;

        // Start countdown and set next refresh
        startCountdown();
        refreshTimer = setTimeout(fetchQR, refreshInterval);

      } catch (error) {
        statusDiv.className = 'status status-error';
        statusDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Error: ' + error.message;
        qrContainer.classList.remove('loading');
        console.error('QR error:', error);
        
        // Retry after 5 seconds
        setTimeout(fetchQR, 5000);
      }
    }

    // Refresh button handler
    refreshBtn.addEventListener('click', () => {
      fetchQR();
    });

    // Initial fetch
    fetchQR();

    // Clean up on page unload
    window.addEventListener('beforeunload', () => {
      clearInterval(countdown);
      clearTimeout(refreshTimer);
      if (qrImage._lastObjectUrl) {
        URL.revokeObjectURL(qrImage._lastObjectUrl);
      }
    });
  </script>
</body>
</html>
