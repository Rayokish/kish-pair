<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KISH-MD Pair Code Generator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --background: #0f172a;
      --surface: #1e293b;
      --primary: #3b82f6;
      --primary-glow: #60a5fa;
      --secondary: #10b981;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
      --border: #334155;
      --input-bg: #1e293b;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background: var(--background);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      line-height: 1.6;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 20%);
      pointer-events: none;
      z-index: -1;
    }
    
    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    
    .header {
      text-align: center;
      padding: 20px;
    }
    
    .logo {
      font-size: 3rem;
      margin-bottom: 10px;
      color: var(--primary);
      text-shadow: 0 0 15px var(--primary-glow);
    }
    
    .title {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    
    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }
    
    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }
    
    .input-group {
      margin-bottom: 20px;
    }
    
    .input-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-muted);
    }
    
    .input-field {
      width: 100%;
      background: var(--input-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      color: var(--text);
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    
    .input-field:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
    }
    
    .btn {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px 32px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .btn-loading {
      opacity: 0.8;
      pointer-events: none;
    }
    
    .output-container {
      margin-top: 24px;
      min-height: 100px;
    }
    
    .message {
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .message-success {
      background: rgba(34, 197, 94, 0.1);
      color: var(--success);
      border-left: 4px solid var(--success);
    }
    
    .message-error {
      background: rgba(239, 68, 68, 0.1);
      color: var(--error);
      border-left: 4px solid var(--error);
    }
    
    .message-warning {
      background: rgba(245, 158, 11, 0.1);
      color: var(--warning);
      border-left: 4px solid var(--warning);
    }
    
    .pair-code {
      background: rgba(16, 185, 129, 0.1);
      border: 2px solid var(--secondary);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 16px;
    }
    
    .pair-code:hover {
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
    }
    
    .code-text {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 4px;
      margin: 10px 0;
      color: var(--secondary);
      text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }
    
    .hint {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 8px;
    }
    
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 32px;
    }
    
    .feature {
      background: rgba(59, 130, 246, 0.1);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s ease;
    }
    
    .feature:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2);
    }
    
    .feature-icon {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 12px;
    }
    
    .feature-title {
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .feature-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    
    footer {
      text-align: center;
      color: var(--text-muted);
      padding: 20px;
      font-size: 0.9rem;
    }
    
    .progress-bar {
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      width: 0;
      border-radius: 2px;
      margin-top: 16px;
      transition: width 1.5s ease;
    }
    
    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }
    
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    .delay-4 { animation-delay: 0.4s; }
    
    /* Responsive adjustments */
    @media (max-width: 768px) {
      .features {
        grid-template-columns: 1fr;
      }
      
      .title {
        font-size: 1.8rem;
      }
      
      .card {
        padding: 20px;
      }
    }
    
    /* Particle background effect */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }
    
    .particle {
      position: absolute;
      border-radius: 50%;
      background: var(--primary);
      opacity: 0.3;
      animation: float 15s infinite linear;
    }
    
    @keyframes float {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.3;
      }
      90% {
        opacity: 0.3;
      }
      100% {
        transform: translateY(-100vh) translateX(100vw);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  
  <div class="container">
    <header class="header fade-in">
      <div class="logo">
        <i class="fas fa-key"></i>
      </div>
      <h1 class="title">KISH-MD Pair Code Generator</h1>
      <p class="subtitle">Generate secure pairing codes for your WhatsApp bot</p>
    </header>
    
    <main class="card fade-in delay-1">
      <div class="input-group">
        <label class="input-label">WhatsApp Number</label>
        <input type="text" id="whatsappNumber" class="input-field" 
               placeholder="Enter your number with country code (e.g. +1234567890)" 
               onkeypress="if(event.key === 'Enter') getPairCode()">
        <p class="hint">Include your country code. We don't store your number.</p>
      </div>
      
      <button id="submit-btn" class="btn" onclick="getPairCode()">
        <i class="fas fa-bolt"></i> Generate Pair Code
      </button>
      
      <div class="progress-bar" id="progress-bar"></div>
      
      <div class="output-container">
        <div id="message"></div>
        <div id="pair-code" class="pair-code" style="display: none;">
          <div>Your Pair Code:</div>
          <div class="code-text" id="code-text"></div>
          <div class="hint">Click to copy to clipboard</div>
        </div>
      </div>
    </main>
    
    <div class="features">
      <div class="feature fade-in delay-2">
        <div class="feature-icon">
          <i class="fas fa-mobile-alt"></i>
        </div>
        <div class="feature-title">Multi-Device Support</div>
        <div class="feature-desc">Works with all WhatsApp multi-device implementations</div>
      </div>
    </div>
    
    <footer class="fade-in">
      KISH-MD &copy; <span id="currentYear"></span> | Powered by BrashoKish
    </footer>
  </div>

  <script>
    // Set current year
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    // Create particle background
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      const particleCount = 30;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        
        // Random properties
        const size = Math.random() * 5 + 2;
        const posX = Math.random() * 100;
        const posY = Math.random() * 100;
        const delay = Math.random() * 15;
        const duration = Math.random() * 10 + 15;
        
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${posX}vw`;
        particle.style.top = `${posY}vh`;
        particle.style.animationDelay = `${delay}s`;
        particle.style.animationDuration = `${duration}s`;
        
        // Random color (blue or green)
        const colors = ['#3b82f6', '#10b981'];
        particle.style.background = colors[Math.floor(Math.random() * colors.length)];
        
        particlesContainer.appendChild(particle);
      }
    }
    
    // DOM elements
    const input = document.getElementById('whatsappNumber');
    const submitBtn = document.getElementById('submit-btn');
    const progressBar = document.getElementById('progress-bar');
    const message = document.getElementById('message');
    const pairCode = document.getElementById('pair-code');
    const codeText = document.getElementById('code-text');
    
    // Validate phone number input
    input.addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9+]/g, '');
    });
    
    // Show loading state during verification
    async function showLoading() {
      submitBtn.classList.add('btn-loading');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
      
      // Animate progress bar
      progressBar.style.width = '100%';
      progressBar.style.transition = 'width 1.5s ease';
      
      await delay(1500);
    }
    
    // Hide loading state
    function hideLoading() {
      submitBtn.classList.remove('btn-loading');
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fas fa-bolt"></i> Generate Pair Code';
      progressBar.style.width = '0';
    }
    
    // Helper function for delays
    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
    
    // Show message
    function showMessage(type, text, icon) {
      message.innerHTML = `
        <div class="message message-${type}">
          <i class="${icon}"></i>
          <div>${text}</div>
        </div>
      `;
      message.style.display = 'block';
    }
    
    // Copy to clipboard function
    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        showMessage('success', 'Code copied to clipboard!', 'fas fa-check-circle');
        return true;
      } catch (err) {
        console.error('Failed to copy: ', err);
        showMessage('error', 'Failed to copy to clipboard', 'fas fa-times-circle');
        return false;
      }
    }
    
    // Main function to get pair code
    async function getPairCode() {
      const number = document.getElementById('whatsappNumber').value.trim();
      
      if (!number) {
        showMessage('error', 'Please enter your WhatsApp number', 'fas fa-times-circle');
        return;
      }

      const cleanNumber = number.replace(/[^0-9]/g, "");

      if (cleanNumber.length < 11) {
        showMessage('error', 'Invalid number format (include country code)', 'fas fa-times-circle');
        return;
      }

      showMessage('warning', `Generating pair code for ${number}...`, 'fas fa-spinner fa-spin');
      pairCode.style.display = 'none';
      await showLoading();
      
      try {
        // Make API call to get pair code
        const response = await fetch(`/code?number=${cleanNumber}`);
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        const code = data.code || "SERVICE-UNAVAILABLE";
        
        // Display the pair code
        codeText.textContent = code;
        pairCode.style.display = 'block';
        
        // Add click to copy functionality
        pairCode.onclick = () => copyToClipboard(code);
        
        showMessage('success', 'Pair code generated successfully!', 'fas fa-check-circle');
      } catch (error) {
        console.error('Error fetching pair code:', error);
        showMessage('error', 'Error generating pair code. Please try again.', 'fas fa-times-circle');
        pairCode.style.display = 'none';
      } finally {
        hideLoading();
      }
    }
    
    // Initialize the page
    window.onload = function() {
      createParticles();
      input.focus();
    };
  </script>
</body>
</html>
