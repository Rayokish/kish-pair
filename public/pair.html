<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KISH-MD PAIR CODE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #000;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    .container {
      position: relative;
      z-index: 2;
    }

    .box {
      width: 320px;
      padding: 30px;
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 15px;
      border: 2px solid #0ff;
      box-shadow: 0 0 20px #0ff, 0 0 40px #0ff inset;
      position: relative;
      overflow: hidden;
    }

    .box::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        to bottom right,
        rgba(0, 255, 255, 0.1),
        rgba(0, 255, 255, 0) 50%
      );
      transform: rotate(30deg);
      animation: shine 6s infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes shine {
      0% { transform: rotate(30deg) translate(-30%, -30%); }
      100% { transform: rotate(30deg) translate(30%, 30%); }
    }

    h2 {
      color: #0ff;
      text-align: center;
      font-size: 28px;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
      animation: pulse 2s infinite alternate;
    }

    h6 {
      color: #f0f;
      text-align: center;
      font-size: 14px;
      margin-bottom: 25px;
      text-shadow: 0 0 5px #f0f, 0 0 10px #f0f;
      animation: pulse 2s infinite alternate-reverse;
    }

    @keyframes pulse {
      0% { opacity: 0.8; text-shadow: 0 0 5px currentColor; }
      100% { opacity: 1; text-shadow: 0 0 20px currentColor, 0 0 30px currentColor; }
    }

    .input-container {
      display: flex;
      margin-bottom: 20px;
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
    }

    .input-container input {
      flex: 1;
      padding: 15px;
      border: none;
      background: rgba(0, 0, 0, 0.7);
      color: #0ff;
      font-size: 16px;
      border: 1px solid #0ff;
      border-right: none;
      outline: none;
      text-shadow: 0 0 5px #0ff;
      z-index: 1;
    }

    .input-container button {
      padding: 15px 20px;
      background: linear-gradient(45deg, #0ff, #f0f);
      color: #000;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .input-container button:hover {
      background: linear-gradient(45deg, #f0f, #0ff);
      box-shadow: 0 0 20px #f0f;
    }

    #waiting-message {
      display: none;
      color: #0ff;
      text-align: center;
      margin: 15px 0;
      text-shadow: 0 0 10px #0ff;
      animation: pulse 1.5s infinite;
    }

    #pair {
      color: #f0f;
      text-align: center;
      margin-top: 20px;
      font-size: 18px;
      text-shadow: 0 0 10px #f0f;
      min-height: 50px;
    }

    .powered-by {
      margin-top: 30px;
      text-align: center;
      color: #fff;
      font-size: 14px;
      text-shadow: 0 0 5px #fff;
      animation: colorChange 5s infinite;
    }

    @keyframes colorChange {
      0% { color: #0ff; text-shadow: 0 0 5px #0ff; }
      50% { color: #f0f; text-shadow: 0 0 5px #f0f; }
      100% { color: #0ff; text-shadow: 0 0 5px #0ff; }
    }

    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(0, 255, 255, 0.05) 1px,
        transparent 1px
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 0;
      animation: scanline 10s linear infinite;
    }

    @keyframes scanline {
      0% { background-position: 0 0; }
      100% { background-position: 0 100%; }
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="container">
    <div class="box">
      <h2>KISH-MD PAIR</h2>
      <h6>⚙ Enter your number with country code ⚙</h6>
      <div class="input-container">
        <input type="text" id="number" placeholder="+1234567890" inputmode="numeric">
        <button id="submit">ENTER</button>
      </div>
      <a id="waiting-message" class="centered-text">in process...</a>
      <main id="pair"></main>
      <div class="powered-by">Powered by KISH-MD</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    let pairElement = document.getElementById("pair");
    let submitButton = document.getElementById("submit");
    let numberInput = document.getElementById("number");
    let waitingMessage = document.getElementById("waiting-message");

    numberInput.addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9+]/g, '');
    });

    async function copyCode() {
      let text = document.getElementById("copy").innerText;
      await navigator.clipboard.writeText(text.replace('CODE: ', ''));
      document.getElementById("copy").innerText = "COPIED!";
      setTimeout(() => {
        document.getElementById("copy").innerText = text;
      }, 1000);
    }

    submitButton.addEventListener("click", async (e) => {
      e.preventDefault();
      waitingMessage.style.display = "block";

      if (!numberInput.value) {
        pairElement.innerHTML = '<span style="color:#f0f; text-shadow:0 0 10px #f0f;">❗ Enter your WhatsApp number</span>';
        waitingMessage.style.display = "none";
        return;
      }

      const cleanNumber = numberInput.value.replace(/[^0-9]/g, "");

      if (cleanNumber.length < 11) {
        pairElement.innerHTML = '<span style="color:#f0f; text-shadow:0 0 10px #f0f;">❌ Invalid number format</span>';
        waitingMessage.style.display = "none";
        return;
      }

      try {
        const formattedNumber = `+${cleanNumber.substring(0, 3)} ${cleanNumber.substring(3, 8)} ${cleanNumber.substring(8)}`;
        numberInput.value = formattedNumber;

        const { data } = await axios.get(`/code?number=${cleanNumber}`);
        const code = data.code || "Service Unavailable";

        pairElement.innerHTML = `
          <div id="copy" onclick="copyCode()" style="cursor: pointer; color:#f0f; text-shadow:0 0 10px #f0f;">
            CODE: <span style="color:#0ff; text-shadow:0 0 10px #0ff;">${code}</span>
          </div>
        `;
      } catch (error) {
        pairElement.innerHTML = '<span style="color:#f0f; text-shadow:0 0 10px #f0f;">⚠️ Connection Error</span>';
      } finally {
        waitingMessage.style.display = "none";
      }
    });

    numberInput.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        submitButton.click();
      }
    });
  </script>
</body>
</html>
