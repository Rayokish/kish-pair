<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KISH-MD</title>
  <link rel="shortcut icon" href="" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    /* ===== LOADING SCREEN STYLES ===== */
    :root {
      --neon-green: #00ff9d;
      --neon-blue: #00f2ff;
      --neon-purple: #b400ff;
      --dark-bg: #0a0a0a;
    }
    
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--dark-bg);
      overflow: hidden;
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .grid-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
          linear-gradient(rgba(0, 255, 157, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 157, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      opacity: 0.3;
    }

    .cyber-container {
      position: relative;
      width: 300px;
      height: 300px;
      z-index: 2;
    }

    .cyber-loader {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .cyber-spinner {
      width: 100%;
      height: 100%;
      border: 4px solid var(--neon-green);
      border-radius: 50%;
      position: relative;
      animation: rotate 2s linear infinite;
      box-shadow: 0 0 30px var(--neon-green);
    }

    .cyber-spinner::before {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: var(--neon-green);
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      box-shadow: 0 0 20px var(--neon-green);
    }

    .scan-lines {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom,
          transparent 50%,
          rgba(0, 255, 157, 0.2) 51%,
          transparent 52%);
      background-size: 100% 4px;
      animation: scan 0.5s linear infinite;
      border-radius: 50%;
    }

    .hud-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--neon-green);
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      text-align: center;
      text-shadow: 0 0 10px var(--neon-green);
      width: 100%;
      letter-spacing: 2px;
    }

    .progress-container {
      position: absolute;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      height: 4px;
      background: rgba(0, 255, 157, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, var(--neon-green), var(--neon-blue));
      transition: width 0.1s linear;
      box-shadow: 0 0 10px var(--neon-green);
    }

    .status-text {
      position: absolute;
      bottom: 22%;
      left: 50%;
      transform: translateX(-50%);
      color: var(--neon-green);
      font-size: 0.8rem;
      text-align: center;
      width: 100%;
      opacity: 0.8;
    }

    .binary-rain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: rgba(0, 255, 157, 0.1);
      font-size: 16px;
      line-height: 1.5;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .binary-column {
      display: inline-block;
      vertical-align: top;
      width: 20px;
      margin-right: 10px;
      animation: binaryFall 10s linear infinite;
      animation-delay: calc(var(--delay) * 1s);
    }

    .glow-effect {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0, 255, 157, 0.1) 0%, transparent 70%);
      animation: pulse 3s infinite alternate;
      border-radius: 50%;
      z-index: -1;
    }

    .cyber-border {
      position: absolute;
      width: calc(100% + 20px);
      height: calc(100% + 20px);
      top: -10px;
      left: -10px;
      border: 2px solid var(--neon-green);
      border-radius: 50%;
      box-shadow: 0 0 20px var(--neon-green);
      opacity: 0.5;
      pointer-events: none;
    }

    .redirect-notice {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(0, 255, 157, 0.7);
      font-size: 0.7rem;
      text-align: center;
      width: 80%;
      animation: blink 2s infinite;
    }

    /* Security notice style */
    .block-notice {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(255,0,0,0.7);
      color: white;
      text-align: center;
      padding: 10px;
      z-index: 99999;
      display: none;
      font-family: 'Share Tech Mono', monospace;
      font-weight: bold;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes scan {
      0% { background-position: 0 0; }
      100% { background-position: 0 100%; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    @keyframes binaryFall {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* ===== MAIN BOT STYLES ===== */
    body {
      background-color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: white;
      font-family: Arial, sans-serif;
    }

    .button-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      animation: fadeIn 1s forwards 4s;
    }

    h3 {
      margin-top: -40px;
      opacity: 0;
      animation: fadeIn 3s forwards;
    }

    .button {
      width: 140px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0px 15px;
      background-color: red;
      border-radius: 10px;
      border: none;
      color: white;
      position: relative;
      cursor: pointer;
      font-weight: 900;
      transition-duration: .2s;
      background: linear-gradient(0deg, #000, #272727);
      text-decoration: none;
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background-color: #222;
      color: #fff;
      padding: 10px 0;
      text-align: center;
      font-size: 14px;
    }

    .button:before, .button:after {
      content: '';
      position: absolute;
      left: -2px;
      top: -2px;
      border-radius: 10px;
      background: linear-gradient(45deg, #48ff00, #15ff00, #000000,#000000, #ff0000);
      background-size: 400%;
      width: calc(100% + 4px);
      height: calc(100% + 4px);
      z-index: -1;
      animation: steam 10s linear infinite;
    }

    @keyframes steam {
      0% {
        background-position: 0 0;
      }
      50% {
        background-position: 400% 0;
      }
      100% {
        background-position: 0 0;
      }
    }

    .button:after {
      filter: blur(50px);
    }

    .button span {
      z-index: 1;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <!-- Security Notice (for silent blocking) -->
  <div id="blockNotice" class="block-notice">Security restriction activated</div>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="grid-overlay"></div>
    <div class="binary-rain" id="binaryRain"></div>
    <div class="cyber-container">
      <div class="cyber-border"></div>
      <div class="glow-effect"></div>
      <div class="cyber-loader">
        <div class="cyber-spinner"></div>
        <div class="scan-lines"></div>
        <div class="hud-text" id="hudText">KISH-MD LOADING</div>
        <div class="status-text" id="statusText">Initializing interface...</div>
        <div class="progress-container">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
      <div class="redirect-notice">Preparing KISH-MD interface...</div>
    </div>
  </div>

  <!-- Main Bot Content (hidden initially) -->
  <div class="button-container">
    <h3>SELECT AN OPTION </h3>
    <div></div>
    <a href="/pair" class="button" target="_blank"> <span>PAIR CODE</span> </a> <br>
    <a href="/qr" class="button" target="_blank"> <span>QR CODE</span> </a> <br>
    <a href="https://github.com/Brashokish/Kish-MD/fork" class="button" target="_blank"> <span>FORK KISH-MD</span> </a> <br>
    <a href="https://whatsapp.com/channel/0029VabXGW8BKfhwAKCfBp0o" class="button" target="_blank"> <span>WhatsApp</span> </a> <br>

    <p>FACE ANY ISSUES CLICK ERROR BUTTON</p>
    <a href="https://wa.me/254796307638" class="button" target="_blank"> <span>ERROR</span> </a> <br>

    <footer>
      KISH-MD &copy; <span id="currentYear"></span>
    </footer>
    <div id="clock"></div>
  </div>

  <script>
    // ===== SECURITY CONFIGURATION =====
    const SHOW_ALERTS = false; // Set to true to show alert messages
    
    // Silent blocking notification system
    function showBlockNotice(message) {
      if (!SHOW_ALERTS) {
        const notice = document.getElementById('blockNotice');
        notice.textContent = message;
        notice.style.display = 'block';
        setTimeout(() => notice.style.display = 'none', 2000);
      }
    }

    // ===== ANTI-COPY PROTECTION =====
    // Disable right-click
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      if (SHOW_ALERTS) alert('Right-click is disabled');
      else showBlockNotice('Right-click disabled');
    });

    // Disable text selection
    document.addEventListener('selectstart', function(e) {
      e.preventDefault();
    });

    // Disable keyboard shortcuts
    document.addEventListener('keydown', function(e) {
      // Ctrl+U (View source)
      if (e.ctrlKey && e.keyCode === 85) {
        e.preventDefault();
        if (SHOW_ALERTS) alert('View source is disabled');
        else showBlockNotice('Source viewing disabled');
      }
      // Ctrl+Shift+I/F12 (DevTools)
      else if ((e.ctrlKey && e.shiftKey && e.keyCode === 73) || e.keyCode === 123) {
        e.preventDefault();
        if (SHOW_ALERTS) alert('Developer tools are disabled');
        else showBlockNotice('Developer tools restricted');
      }
      // Ctrl+C (Copy)
      else if (e.ctrlKey && e.keyCode === 67) {
        e.preventDefault();
        if (SHOW_ALERTS) alert('Copying is disabled');
        else showBlockNotice('Copy protection active');
      }
      // Ctrl+S (Save page)
      else if (e.ctrlKey && e.keyCode === 83) {
        e.preventDefault();
        if (SHOW_ALERTS) alert('Page saving is disabled');
        else showBlockNotice('Save function disabled');
      }
    });

    // Anti-iframe protection
    if (window.top !== window.self) {
      window.top.location = window.self.location;
    }

    // ===== LOADING SCREEN SCRIPT =====
    // Create binary rain effect
    function createBinaryRain() {
      const binaryRain = document.getElementById('binaryRain');
      const columns = Math.floor(window.innerWidth / 30);
      
      for (let i = 0; i < columns; i++) {
        const column = document.createElement('div');
        column.className = 'binary-column';
        column.style.setProperty('--delay', Math.random());
        
        let binaryString = '';
        const rows = Math.floor(window.innerHeight / 24) + 2;
        for (let j = 0; j < rows; j++) {
          binaryString += Math.random() > 0.5 ? '1' : '0';
          binaryString += '<br>';
        }
        
        column.innerHTML = binaryString;
        binaryRain.appendChild(column);
      }
    }

    // Status messages for loading screen
    const statusMessages = [
      "Initializing interface...",
      "Loading assets...",
      "Preparing options...",
      "Almost ready...",
      "Launching KISH-MD..."
    ];

    // Update progress and status
    let progress = 0;
    const progressFill = document.getElementById('progressFill');
    const hudText = document.getElementById('hudText');
    const statusText = document.getElementById('statusText');
    let currentStatus = 0;

    const updateProgress = () => {
      progress += 1;
      progressFill.style.width = `${progress}%`;
      
      if (progress % 20 === 0) {
        currentStatus = (currentStatus + 1) % statusMessages.length;
        statusText.textContent = statusMessages[currentStatus];
      }
      
      if (progress >= 100) {
        hudText.textContent = "READY";
        statusText.textContent = "Launching interface...";
        clearInterval(progressInterval);
      }
    };

    const progressInterval = setInterval(updateProgress, 30);

    // Initialize effects
    createBinaryRain();

    // Hide loading screen after 4 seconds
    setTimeout(() => {
      document.getElementById('loading-screen').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('loading-screen').style.display = 'none';
        window.location.href = '/fork-check'; // Add this line
      }, 500);
    }, 4000);

    // Allow click/tap to skip loading
    document.addEventListener('click', () => {
      clearInterval(progressInterval);
      hudText.textContent = "LAUNCHING...";
      statusText.textContent = "Loading interface now";
      progressFill.style.width = "100%";
      setTimeout(() => {
        document.getElementById('loading-screen').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loading-screen').style.display = 'none';
        }, 300);
      }, 300);
    });

    // Touch support for mobile
    document.addEventListener('touchstart', () => {
      clearInterval(progressInterval);
      hudText.textContent = "LAUNCHING...";
      statusText.textContent = "Loading interface now";
      progressFill.style.width = "100%";
      setTimeout(() => {
        document.getElementById('loading-screen').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loading-screen').style.display = 'none';
        }, 300);
      }, 300);
    });

    // ===== MAIN BOT SCRIPT =====
    // Function to display current time
    function updateTime() {
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');
      const time = `${hours}:${minutes}:${seconds}`;
      document.getElementById('clock').innerText = time;
    }

    // Update the clock every second
    setInterval(updateTime, 1000);
    updateTime();

    // Set current year in footer
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    /* 
    ===== SERVER-SIDE PROTECTION RECOMMENDATIONS =====
    (To be implemented on your web server)
    
    1. NGINX Configuration:
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com;";
    
    2. Rate limiting to prevent brute force attacks
    3. IP-based access controls for sensitive endpoints
    4. Proper CORS configuration
    5. Cache control for sensitive pages
    */
  </script>
</body>
