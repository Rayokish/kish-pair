<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KISH-MD Fork Verification</title>
  <style>
    :root {
      --background: #0d1117;
      --text: #c9d1d9;
      --primary: #58a6ff;
      --success: #3fb950;
      --error: #f85149;
      --warning: #d29922;
      --border: #30363d;
      --prefix: #7ee787;
      --cursor: #f0f6fc;
      --input-bg: #161b22;
      --selection: rgba(56, 139, 253, 0.3);
      --neon-green: #00ff9d;
      --neon-blue: #00f2ff;
      --neon-purple: #b400ff;
      --dark-bg: #0a0a0a;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background: var(--background);
      color: var(--text);
      font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      line-height: 1.5;
    }
    
    .terminal {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 100%;
      max-width: 700px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      color: var(--primary);
    }
    
    .logo {
      font-size: 24px;
      margin-right: 10px;
    }
    
    .title {
      font-weight: bold;
    }
    
    .prompt {
      color: var(--prefix);
      margin-bottom: 5px;
      white-space: pre-wrap;
    }
    
    .command-line {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    
    .prefix {
      color: var(--prefix);
      margin-right: 8px;
      user-select: none;
    }
    
    input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: inherit;
      padding: 5px 0;
      caret-color: var(--cursor);
    }
    
    input::selection {
      background: var(--selection);
    }
    
    input:focus {
      outline: none;
    }
    
    .btn {
      background: var(--primary);
      color: var(--background);
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
      position: relative;
      overflow: hidden;
    }
    
    .btn:hover {
      background: #388bfd;
    }
    
    .btn:active {
      transform: translateY(1px);
    }
    
    .btn-loading::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      animation: loading 1.5s infinite;
    }
    
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    
    .output {
      margin-top: 20px;
      min-height: 24px;
      white-space: pre-wrap;
    }
    
    .success {
      color: var(--success);
    }
    
    .error {
      color: var(--error);
    }
    
    .warning {
      color: var(--warning);
    }
    
    .typing {
      border-right: 2px solid var(--text);
      animation: blink 1s step-end infinite;
    }
    
    @keyframes blink {
      from, to { border-color: transparent; }
      50% { border-color: var(--text); }
    }
    
    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 25px;
      font-size: 13px;
    }
    
    .feature {
      background: rgba(56, 139, 253, 0.15);
      color: var(--primary);
      padding: 4px 8px;
      border-radius: 20px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 0.3s forwards;
    }
    
    .feature:nth-child(1) { animation-delay: 0.1s; }
    .feature:nth-child(2) { animation-delay: 0.2s; }
    .feature:nth-child(3) { animation-delay: 0.3s; }
    .feature:nth-child(4) { animation-delay: 0.4s; }
    
    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    footer {
      margin-top: 30px;
      color: #6e7681;
      font-size: 12px;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.5s 0.5s forwards;
    }
    
    .progress-bar {
      height: 2px;
      background: var(--primary);
      width: 0;
      margin-top: 10px;
      transition: width 0.3s;
    }
    
    /* Terminal output animations */
    .terminal-output {
      animation: fadeInUp 0.3s;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Loading screen styles */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--dark-bg);
      overflow: hidden;
      font-family: 'Share Tech Mono', monospace;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .grid-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
          linear-gradient(rgba(0, 255, 157, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 157, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      opacity: 0.3;
    }

    .cyber-container {
      position: relative;
      width: 300px;
      height: 300px;
      z-index: 2;
    }

    .cyber-loader {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .cyber-spinner {
      width: 100%;
      height: 100%;
      border: 4px solid var(--neon-green);
      border-radius: 50%;
      position: relative;
      animation: rotate 2s linear infinite;
      box-shadow: 0 0 30px var(--neon-green);
    }

    .cyber-spinner::before {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: var(--neon-green);
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      box-shadow: 0 0 20px var(--neon-green);
    }

    .scan-lines {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom,
          transparent 50%,
          rgba(0, 255, 157, 0.2) 51%,
          transparent 52%);
      background-size: 100% 4px;
      animation: scan 0.5s linear infinite;
      border-radius: 50%;
    }

    .hud-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--neon-green);
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      text-align: center;
      text-shadow: 0 0 10px var(--neon-green);
      width: 100%;
      letter-spacing: 2px;
    }

    .progress-container {
      position: absolute;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      height: 4px;
      background: rgba(0, 255, 157, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, var(--neon-green), var(--neon-blue));
      transition: width 0.1s linear;
      box-shadow: 0 0 10px var(--neon-green);
    }

    .status-text {
      position: absolute;
      bottom: 22%;
      left: 50%;
      transform: translateX(-50%);
      color: var(--neon-green);
      font-size: 0.8rem;
      text-align: center;
      width: 100%;
      opacity: 0.8;
    }

    .binary-rain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: rgba(0, 255, 157, 0.1);
      font-size: 16px;
      line-height: 1.5;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .binary-column {
      display: inline-block;
      vertical-align: top;
      width: 20px;
      margin-right: 10px;
      animation: binaryFall 10s linear infinite;
      animation-delay: calc(var(--delay) * 1s);
    }

    .glow-effect {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0, 255, 157, 0.1) 0%, transparent 70%);
      animation: pulse 3s infinite alternate;
      border-radius: 50%;
      z-index: -1;
    }

    .cyber-border {
      position: absolute;
      width: calc(100% + 20px);
      height: calc(100% + 20px);
      top: -10px;
      left: -10px;
      border: 2px solid var(--neon-green);
      border-radius: 50%;
      box-shadow: 0 0 20px var(--neon-green);
      opacity: 0.5;
      pointer-events: none;
    }

    .redirect-notice {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(0, 255, 157, 0.7);
      font-size: 0.7rem;
      text-align: center;
      width: 80%;
      animation: blink 2s infinite;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes scan {
      0% { background-position: 0 0; }
      100% { background-position: 0 100%; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    @keyframes binaryFall {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    
    /* Responsive adjustments */
    @media (max-width: 600px) {
      .terminal {
        padding: 16px;
      }
      .header {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <!-- Fork Verification Screen -->
  <div class="terminal">
    <div class="header">
      <div class="logo">❯</div>
      <div class="title">KISH-MD Fork Verification</div>
    </div>
    
    <div id="welcome-prompt" class="prompt"></div>
    
    <div class="command-line">
      <span class="prefix">$</span>
      <input type="text" id="githubUsername" placeholder="" 
             onkeypress="if(event.key === 'Enter') isForked()">
    </div>
    
    <button id="verify-btn" class="btn" onclick="isForked()">Run Verification</button>
    <div class="progress-bar" id="progress-bar"></div>
    
    <div id="message" class="output"></div>
    
    <div class="features">
      <div class="feature">Multi-Device</div>
      <div class="feature">AI Powered</div>
      <div class="feature">200+ Commands</div>
      <div class="feature">Secure</div>
    </div>
    
    <footer>
      KISH-MD &copy; <span id="currentYear"></span> | Powered by BrashoKish
    </footer>
  </div>

  <!-- Loading Screen (hidden initially) -->
  <div id="loading-screen">
    <div class="grid-overlay"></div>
    <div class="binary-rain" id="binaryRain"></div>
    <div class="cyber-container">
      <div class="cyber-border"></div>
      <div class="glow-effect"></div>
      <div class="cyber-loader">
        <div class="cyber-spinner"></div>
        <div class="scan-lines"></div>
        <div class="hud-text" id="hudText">KISH-MD LOADING</div>
        <div class="status-text" id="statusText">Initializing interface...</div>
        <div class="progress-container">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
      <div class="redirect-notice">Preparing KISH-MD interface...</div>
    </div>
  </div>

  <script>
    // Set current year
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    // Animated welcome message
    const welcomeMessages = [
      "Welcome to KISH-MD Fork Verification",
      "Please verify your GitHub fork to proceed with pairing",
      "Enter your GitHub username below ↓"
    ];
    
    const welcomePrompt = document.getElementById('welcome-prompt');
    const input = document.getElementById('githubUsername');
    const verifyBtn = document.getElementById('verify-btn');
    const progressBar = document.getElementById('progress-bar');
    
    // Type welcome messages one by one
    async function typeWelcomeMessages() {
      for (const message of welcomeMessages) {
        await typeText(welcomePrompt, message);
        await delay(500);
        welcomePrompt.innerHTML += '<br><br>';
      }
      // Start input placeholder animation after welcome messages
      typeInputPlaceholder();
    }
    
    // Type text with cursor animation
    async function typeText(element, text) {
      element.innerHTML = '';
      const cursor = document.createElement('span');
      cursor.className = 'typing';
      element.appendChild(cursor);
      
      for (let i = 0; i < text.length; i++) {
        cursor.remove();
        element.innerHTML += text[i];
        element.appendChild(cursor);
        await delay(Math.random() * 50 + 30);
      }
      
      cursor.remove();
    }
    
    // Type input placeholder
    async function typeInputPlaceholder() {
      const placeholderText = "Enter GitHub username and press Enter";
      input.placeholder = '';
      
      for (let i = 0; i < placeholderText.length; i++) {
        input.placeholder = placeholderText.substring(0, i + 1);
        await delay(Math.random() * 50 + 30);
      }
      
      // Add blinking cursor effect
      input.focus();
    }
    
    // Helper function for delays
    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
    
    // Initialize animations
    setTimeout(typeWelcomeMessages, 500);
    
    // Reset placeholder animation when input is focused/blurred
    input.addEventListener('focus', () => {
      input.placeholder = "Enter GitHub username and press Verification";
    });
    
    input.addEventListener('blur', () => {
      if (input.value === '') {
        typeInputPlaceholder();
      }
    });
    
    // Show loading state during verification
    async function showLoading() {
      verifyBtn.classList.add('btn-loading');
      verifyBtn.disabled = true;
      
      // Animate progress bar
      progressBar.style.width = '100%';
      progressBar.style.transition = 'width 1.5s linear';
      
      await delay(1500);
    }
    
    // Hide loading state
    function hideLoading() {
      verifyBtn.classList.remove('btn-loading');
      verifyBtn.disabled = false;
      progressBar.style.width = '0';
    }
    
    // GitHub API check
    async function chkfork(username, repon) {
      const url = `https://api.github.com/repos/${username}/${repon}`;
      const message = document.getElementById('message');

      try {
        const response = await fetch(url);
        if (response.ok) {
          const data = await response.json();
          return data.fork;
        } else {
          showMessage('error', `❌ Error: GitHub username not found or rate limit exceeded`);
          return false;
        }
      } catch (error) {
        console.error('Error:', error);
        showMessage('error', '❌ Network error occurred. Please try again.');
        return false;
      }
    }
    
    // Show animated message
    function showMessage(type, text) {
      const message = document.getElementById('message');
      message.className = 'output terminal-output';
      message.innerHTML = `<span class="${type}">${text}</span>`;
    }
    
    // Start loading screen animation
    function startLoadingScreen() {
      document.getElementById('loading-screen').style.display = 'flex';
      
      // Create binary rain effect
      function createBinaryRain() {
        const binaryRain = document.getElementById('binaryRain');
        const columns = Math.floor(window.innerWidth / 30);
        
        for (let i = 0; i < columns; i++) {
          const column = document.createElement('div');
          column.className = 'binary-column';
          column.style.setProperty('--delay', Math.random());
          
          let binaryString = '';
          const rows = Math.floor(window.innerHeight / 24) + 2;
          for (let j = 0; j < rows; j++) {
            binaryString += Math.random() > 0.5 ? '1' : '0';
            binaryString += '<br>';
          }
          
          column.innerHTML = binaryString;
          binaryRain.appendChild(column);
        }
      }

      // Status messages for loading screen
      const statusMessages = [
        "Initializing interface...",
        "Loading assets...",
        "Preparing options...",
        "Almost ready...",
        "Launching KISH-MD..."
      ];

      // Update progress and status
      let progress = 0;
      const progressFill = document.getElementById('progressFill');
      const hudText = document.getElementById('hudText');
      const statusText = document.getElementById('statusText');
      let currentStatus = 0;

      const updateProgress = () => {
        progress += 1;
        progressFill.style.width = `${progress}%`;
        
        if (progress % 20 === 0) {
          currentStatus = (currentStatus + 1) % statusMessages.length;
          statusText.textContent = statusMessages[currentStatus];
        }
        
        if (progress >= 100) {
          hudText.textContent = "READY";
          statusText.textContent = "Launching interface...";
          clearInterval(progressInterval);
        }
      };

      const progressInterval = setInterval(updateProgress, 30);

      // Initialize effects
      createBinaryRain();

      // Hide loading screen after 4 seconds and redirect
      setTimeout(() => {
        document.getElementById('loading-screen').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loading-screen').style.display = 'none';
          window.location.href = 'https://pair.kishtechsite.online';
        }, 500);
      }, 4000);

      // Allow click/tap to skip loading
      document.addEventListener('click', () => {
        clearInterval(progressInterval);
        hudText.textContent = "LAUNCHING...";
        statusText.textContent = "Loading interface now";
        progressFill.style.width = "100%";
        setTimeout(() => {
          document.getElementById('loading-screen').style.opacity = '0';
          setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
            window.location.href = 'https://pair.kishtechsite.online';
          }, 300);
        }, 300);
      });

      // Touch support for mobile
      document.addEventListener('touchstart', () => {
        clearInterval(progressInterval);
        hudText.textContent = "LAUNCHING...";
        statusText.textContent = "Loading interface now";
        progressFill.style.width = "100%";
        setTimeout(() => {
          document.getElementById('loading-screen').style.opacity = '0';
          setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
            window.location.href = 'https://pair.kishtechsite.online';
          }, 300);
        }, 300);
      });
    }
    
    // Main verification function
    async function isForked() {
      const username = document.getElementById('githubUsername').value.trim();
      const message = document.getElementById('message');

      if (!username) {
        showMessage('error', '❌ Please enter your GitHub username');
        return;
      }

      showMessage('warning', `Verifying fork for ${username}...`);
      await showLoading();
      
      const isForked = await chkfork(username, 'Kish-MD');
      hideLoading();

      if (isForked) {
        showMessage('success', '✅ Repository verified! Loading interface...');
        startLoadingScreen();
      } else {
        showMessage('error', `❌ Fork not found for ${username}`);
        if (confirm("❌ You haven't forked Kish-MD repository. Press OK to fork it now (don't modify the fork name).")) {
          window.open('https://github.com/Brashokish/Kish-MD/fork', '_blank');
        }
      }
    }
    
    // Allow clicking anywhere in terminal to focus input
    document.querySelector('.terminal').addEventListener('click', () => {
      input.focus();
    });
  </script>
</body>
</html>
